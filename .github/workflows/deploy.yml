name: Deploy Theme to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger cPanel Git pull
    runs-on: ubuntu-latest
    steps:
      - name: Update from remote on cPanel
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update?repository_root=%2Fhome%2Fpremia%2Fpublic_html%2Flp%2Fwp-content%2Fthemes%2Fpremiaspine&branch=main"
